<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Registration</title>

    <link rel="stylesheet" href="Pro.css">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            🏥 CityCare Hospital
        </div>

        <nav>

            <a href="#">Home</a>
            <a href="#">Doctors</a>
            <a href="#">Appointments</a>
            <a href="#">Login</a>

        </nav>

    </header>


    <!-- Registration Container -->

    <div class="container">

        <h1>Patient Registration</h1>

        <p class="subtitle">
            Register as a new patient
        </p>


        <!-- IMPORTANT -->

        <form action="PatientRegistrationServlet"
              method="post">


            <!-- First Name -->

            <div class="row">

                <div class="form-group">

                    <label>First Name</label>

                    <input type="text"
                           name="firstName"
                           placeholder="Enter first name"
                           required>

                </div>


                <!-- Last Name -->

                <div class="form-group">

                    <label>Last Name</label>

                    <input type="text"
                           name="lastName"
                           placeholder="Enter last name"
                           required>

                </div>

            </div>


            <!-- DOB + Gender -->

            <div class="row">

                <div class="form-group">

                    <label>Date of Birth</label>

                    <input type="date"
                           name="dob"
                           required>

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <!-- Phone + Email -->

            <div class="row">

                <div class="form-group">

                    <label>Phone Number</label>

                    <input type="tel"
                           name="phone"
                           placeholder="Enter 10 digit number"
                           maxlength="10"
                           required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input type="email"
                           name="email"
                           placeholder="Enter email">

                </div>

            </div>


            <!-- Blood Group + Emergency Contact -->

            <div class="row">

                <div class="form-group">

                    <label>Blood Group</label>

                    <select name="bloodGroup">

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Emergency Contact</label>

                    <input type="tel"
                           name="emergencyContact"
                           placeholder="Emergency contact"
                           maxlength="10">

                </div>

            </div>


            <!-- Address -->

            <div class="form-group full">

                <label>Address</label>

                <textarea name="address"
                          placeholder="Enter complete address"
                          required></textarea>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button type="submit">
                    Register Patient
                </button>

                <button type="reset"
                        class="clear">
                    Clear
                </button>

            </div>

        </form>

    </div>


    <!-- Footer -->

    <footer>

        © 2026 CityCare Hospital

    </footer>

</body>

</html>
