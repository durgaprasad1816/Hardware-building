<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Patient Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <h1>Hospital Patient Registration</h1>

            <p>Register your details for hospital services</p>

        </div>


        <!-- Registration Form -->

        <form id="registrationForm">

            <h2>Patient Information</h2>


            <!-- Full Name -->

            <div class="form-row">

                <div class="form-group">

                    <label for="fullName">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter patient name"
                        required
                    >

                </div>


                <!-- Age -->

                <div class="form-group">

                    <label for="age">
                        Age *
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        max="120"
                        required
                    >

                </div>

            </div>


            <!-- Gender and Blood Group -->

            <div class="form-row">

                <div class="form-group">

                    <label for="gender">
                        Gender *
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select
                        id="bloodGroup"
                        name="bloodGroup"
                    >

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>

            </div>


            <!-- Phone and Email -->

            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                    >

                </div>

            </div>


            <!-- Emergency Contact -->

            <div class="form-group">

                <label for="emergencyContact">
                    Emergency Contact
                </label>

                <input
                    type="tel"
                    id="emergencyContact"
                    name="emergencyContact"
                    placeholder="Enter emergency contact number"
                    maxlength="10"
                >

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">
                    Address *
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="3"
                    placeholder="Enter complete address"
                    required
                ></textarea>

            </div>


            <!-- Symptoms -->

            <div class="form-group">

                <label for="symptoms">
                    Symptoms / Reason for Visit
                </label>

                <textarea
                    id="symptoms"
                    name="symptoms"
                    rows="4"
                    placeholder="Describe symptoms or reason for visit"
                ></textarea>

            </div>


            <!-- Buttons -->

            <div class="button-container">

                <button
                    type="submit"
                    class="register-button"
                >
                    Register Patient
                </button>


                <button
                    type="reset"
                    class="clear-button"
                >
                    Clear
                </button>

            </div>


            <!-- Message -->

            <div
                id="message"
                class="message"
            ></div>

        </form>

    </div>


    <script src="script.js"></script>

</body>

</html>
